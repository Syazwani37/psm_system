<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PSM System - Mother and Baby Health Management">
    <title>Login - PSM System</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #F8BBD0 0%, #FCE4EC 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 0;
        }

        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            padding: 1rem;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #F8BBD0, #F48FB1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.75rem;
            margin: 0 auto 1rem;
            box-shadow: 0 8px 16px rgba(244, 143, 177, 0.3);
        }

        .btn-login {
            background: linear-gradient(135deg, #F06292, #E91E63);
            border: none;
            padding: 1rem;
            border-radius: 50px;
            font-weight: 600;
            width: 100%;
            margin-top: 1rem;
            transition: all 0.3s ease;
            color: white;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(233, 30, 99, 0.3);
            color: white;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #999;
            margin: 2rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #EEE;
        }

        .divider::before { margin-right: 0.5em; }
        .divider::after { margin-left: 0.5em; }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="logo-icon">
                <i class="fas fa-heart"></i>
            </div>
            <h2 class="mb-1" style="font-family: 'Playfair Display', serif;">Welcome Back</h2>
            <p class="text-muted mb-0">Please log in to continue</p>
        </div>

        <div id="errorAlert" class="alert alert-danger d-none" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i><span id="errorMessage"></span>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-medium">Email Address</label>
                <input type="email" id="email" class="form-control form-control-lg" 
                       placeholder="Enter your email" required 
                       style="border-radius: 12px; border: 1px solid #EEE; background: #FAFAFA;">
            </div>

            <div class="mb-3">
                <label class="form-label fw-medium">Password</label>
                <input type="password" id="password" class="form-control form-control-lg" 
                       placeholder="Enter password" required
                       style="border-radius: 12px; border: 1px solid #EEE; background: #FAFAFA;">
            </div>

            <button type="submit" class="btn btn-login">
                Login <i class="fas fa-arrow-right ms-2"></i>
            </button>
        </form>

        <div class="divider">or</div>

        <p class="text-center mb-0">
            Don't have an account? 
            <a href="register.html" class="text-decoration-none fw-bold" style="color: #E91E63;">
                Register here
            </a>
        </p>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Demo login (static mockup)
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        // Demo credentials
        if (email === 'mother@demo.com' && password === 'demo123') {
            window.location.href = 'dashboard/mother.html';
        } else if (email === 'professional@demo.com' && password === 'demo123') {
            window.location.href = 'dashboard/professional.html';
        } else if (email === 'admin@demo.com' && password === 'demo123') {
            window.location.href = 'dashboard/admin.html';
        } else {
            document.getElementById('errorAlert').classList.remove('d-none');
            document.getElementById('errorMessage').textContent = 'Invalid email or password. Try: mother@demo.com / demo123';
        }
    });
</script>

</body>
</html>
